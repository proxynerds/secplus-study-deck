<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CompTIA Security+ SY0-701 Study Deck</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
body{background:#fff;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:0}
@media(prefers-color-scheme:dark){body{background:#1a1a1a;color:#f0f0f0}}
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --color-background-primary:#ffffff;--color-background-secondary:#f5f5f3;--color-background-tertiary:#eeede8;
  --color-text-primary:#1a1a1a;--color-text-secondary:#555552;--color-text-tertiary:#888782;
  --color-border-tertiary:rgba(0,0,0,0.12);--color-border-secondary:rgba(0,0,0,0.22);--color-border-primary:rgba(0,0,0,0.35);
  --border-radius-md:8px;--border-radius-lg:12px;
  --opt-correct-bg:#EAF3DE;--opt-correct-border:#3B6D11;--opt-correct-text:#1a1a1a;--opt-correct-key:#27500A;
  --opt-wrong-bg:#FCEBEB;--opt-wrong-border:#A32D2D;--opt-wrong-text:#1a1a1a;--opt-wrong-key:#791F1F;
}
@media(prefers-color-scheme:dark){:root{
  --color-background-primary:#2a2a2a;--color-background-secondary:#222222;--color-background-tertiary:#1a1a1a;
  --color-text-primary:#f0f0f0;--color-text-secondary:#aaaaaa;--color-text-tertiary:#777777;
  --color-border-tertiary:rgba(255,255,255,0.1);--color-border-secondary:rgba(255,255,255,0.18);--color-border-primary:rgba(255,255,255,0.28);
  --opt-correct-bg:#173404;--opt-correct-border:#639922;--opt-correct-text:#C0DD97;--opt-correct-key:#97C459;
  --opt-wrong-bg:#501313;--opt-wrong-border:#E24B4A;--opt-wrong-text:#F7C1C1;--opt-wrong-key:#F09595;
}}
*{box-sizing:border-box;margin:0;padding:0}
.wrapper{max-width:700px;margin:0 auto;padding:1rem 1.25rem 3rem}
.page-title{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:1.25rem;padding-top:1rem}
.app{padding:1.25rem 0;min-height:400px;font-family:var(--font-sans)}
.topbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.mtab{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 13px;font-size:13px;cursor:pointer;color:var(--color-text-secondary)}
.mtab.on{background:var(--color-background-primary);border-color:var(--color-border-primary);color:var(--color-text-primary);font-weight:500}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px}
.sl{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.sv{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.pb-bg{background:var(--color-background-secondary);border-radius:99px;height:4px;overflow:hidden;margin-bottom:4px}
.pb-fill{height:100%;border-radius:99px;background:#1D9E75;transition:width .35s}
.pb-lbl{font-size:12px;color:var(--color-text-tertiary);margin-bottom:1rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:.75rem}
.badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;display:inline-block;margin-bottom:9px}
.bm{background:#E6F1FB;color:#0C447C}.bv{background:#EEEDFE;color:#3C3489}.br{background:#FAEEDA;color:#633806}.bg{background:#E1F0D2;color:#2A4D0C}
.qt{font-size:14px;color:var(--color-text-primary);line-height:1.65;margin-bottom:1rem}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 12px;text-align:left;font-size:13px;color:var(--color-text-primary);cursor:pointer;display:flex;gap:8px;align-items:flex-start;transition:background .1s,border-color .1s}
.opt:hover:not(:disabled){background:var(--color-background-tertiary);border-color:var(--color-border-secondary)}
.ok{font-weight:500;min-width:15px;color:var(--color-text-secondary);flex-shrink:0}
.opt.correct{background:var(--opt-correct-bg);border-color:var(--opt-correct-border);color:var(--opt-correct-text)}
.opt.correct .ok{color:var(--opt-correct-key)}
.opt.wrong{background:var(--opt-wrong-bg);border-color:var(--opt-wrong-border);color:var(--opt-wrong-text)}
.opt.wrong .ok{color:var(--opt-wrong-key)}
.opt:disabled{cursor:default}
.expl{background:var(--color-background-secondary);border-left:3px solid #1D9E75;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;padding:9px 12px;font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin-top:9px;display:none}
.expl.on{display:block}
.rb{background:#FAEEDA;border-radius:var(--border-radius-md);padding:7px 10px;font-size:13px;color:#633806;margin-bottom:8px}
.vf{font-size:30px;font-weight:500;color:var(--color-text-primary);padding:1.25rem 0 .4rem;text-align:center}
.vh{font-size:13px;color:var(--color-text-tertiary);text-align:center;margin-bottom:.75rem}
.vb{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.9rem;font-size:14px;color:var(--color-text-primary);line-height:1.65;display:none}
.vb.on{display:block}
.vbtns{display:none;gap:8px;justify-content:center;margin-top:.9rem}.vbtns.on{display:flex}
.vbtn{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 18px;font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary)}
.vbtn:hover{background:var(--color-background-secondary)}.vbtn.g{border-color:#3B6D11;color:#3B6D11}.vbtn.r{border-color:#A32D2D;color:#A32D2D}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:.6rem}
.sc{font-size:13px;color:var(--color-text-secondary)}.sc span{font-weight:500;color:var(--color-text-primary)}
.nxt,.navbtn{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 16px;font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary)}
.nxt{display:none}.nxt.on{display:block}
.nxt:hover,.navbtn:hover{background:var(--color-background-secondary)}
.witem{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 11px;margin-bottom:5px;font-size:13px}
.wiq{color:var(--color-text-primary);margin-bottom:3px}.wia{color:#3B6D11;font-size:12px}
.empty{padding:2.5rem;text-align:center;color:var(--color-text-tertiary);font-size:14px}
.shead{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px}
.ldmsg{padding:2rem;text-align:center;color:var(--color-text-tertiary);font-size:14px}
.timer-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;padding:8px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md)}
.tmr-disp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:500;color:var(--color-text-primary);min-width:62px}
.tmr-btn{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 10px;font-size:12px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary)}
.tmr-btn:hover{background:var(--color-background-tertiary)}
</style>
</head>

async function decompress(b64){
  const bin=atob(b64),buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
  w.write(buf);w.close();
  const chunks=[],r=ds.readable.getReader();
  while(true){const{done,value}=await r.read();if(done)break;chunks.push(value);}
  const out=new Uint8Array(chunks.reduce((s,c)=>s+c.length,0));
  let off=0;for(const c of chunks){out.set(c,off);off+=c.length;}
  return new TextDecoder().decode(out);
}

function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let timerInterval=null;
function fmtTime(secs){
  secs=Math.max(0,Math.floor(secs));
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
function renderTimer(){
  const tb=document.getElementById('timerBar');
  const disp=S.timerMode==='countdown'
    ? fmtTime(Math.max(0,S.timerTarget-S.timerElapsed))
    : fmtTime(S.timerElapsed);
  const dimStyle=S.timerRunning?'':'color:var(--color-text-tertiary);opacity:0.55';
  const toggleLabel=S.timerRunning?'⏸':(S.timerElapsed>0||S.timerTarget>0?'▶':'▶');
  if(tb){
    tb.innerHTML=`
      <span style="font-size:12px;color:var(--color-text-tertiary);font-weight:500" title="The SY0-701 exam is 90 questions in 90 minutes">Timer</span>
      <span class="tmr-disp" style="${dimStyle}">${disp}</span>
      <button class="tmr-btn" onclick="timerToggle()">${toggleLabel}</button>
      <button class="tmr-btn" onclick="timerReset()">Reset</button>
      <button class="tmr-btn" onclick="timerOpenSet()">Set time</button>
      <button class="tmr-btn" onclick="timerSwitchMode()" title="Switch between count-up and countdown">${S.timerMode==='countdown'?'↻ Count up':'↻ Countdown'}</button>
    `;
  }
  // Keep banner timer in sync - same value, same dim state
  const bannerTime=document.getElementById('examBannerTime');
  if(bannerTime){
    bannerTime.textContent=disp;
    bannerTime.style.opacity=S.timerRunning?'1':'0.6';
  }
}
function timerTick(){
  S.timerElapsed++;
  if(S.timerMode==='countdown'&&S.timerElapsed>=S.timerTarget){
    timerPause();
    S.timerElapsed=S.timerTarget;
    playBell();
    if(S.simExamActive){
      endSimExam(true);
      return;
    }
  }
  renderTimer();
  sS(PK,S);
}
function timerStart(){
  if(timerInterval)return;
  S.timerRunning=true;
  timerInterval=setInterval(timerTick,1000);
  renderTimer();sS(PK,S);
}
function timerPause(){
  S.timerRunning=false;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  renderTimer();sS(PK,S);
}
function timerToggle(){
  if(S.timerRunning)timerPause();else timerStart();
}
function timerReset(){
  timerPause();
  S.timerElapsed=0;
  renderTimer();sS(PK,S);
}
function timerSwitchMode(){
  timerPause();
  if(S.timerMode==='countdown'){
    S.timerMode='countup';
    S.timerElapsed=0;S.timerTarget=0;
  } else {
    S.timerMode='countdown';
    const mins=prompt('Set countdown time (minutes):','90');
    const m=parseInt(mins,10);
    if(m&&m>0&&m<=999&&String(m).length<=3){S.timerTarget=m*60;S.timerElapsed=0;}
    else{S.timerMode='countup';}
  }
  renderTimer();sS(PK,S);
}
function timerOpenSet(){
  if(S.timerMode==='countup'){
    S.timerMode='countdown';
    const mins=prompt('Set countdown time (minutes):','90');
    const m=parseInt(mins,10);
    if(m&&m>0&&m<=999&&String(m).length<=3){S.timerTarget=m*60;S.timerElapsed=0;}
    else{S.timerMode='countup';}
  } else {
    const mins=prompt('Set countdown time (minutes), or 0 to switch to count-up:','90');
    const m=parseInt(mins,10);
    if(m===0){S.timerMode='countup';S.timerElapsed=0;S.timerTarget=0;}
    else if(m&&m>0&&m<=999&&String(m).length<=3){S.timerTarget=m*60;S.timerElapsed=0;}
  }
  timerPause();
  renderTimer();sS(PK,S);
}

function isViewing(){return S.viewIdx>=0&&S.viewIdx<S.hist.length;}

let _renderLock=false;
function render(){
  if(_renderLock)return;
  _renderLock=true;
  try{
    _renderInner();
  } finally {
    _renderLock=false;
  }
}
function _renderInner(){
  const a=document.getElementById('app');a.innerHTML='';

  // Persistent exam banner - show on all screens except Practice (which has its own inline bar)
  if(S.simExamActive&&S.mode!=='mcq'){
    const disp=fmtTime(Math.max(0,(S.timerTarget||5400)-(S.timerElapsed||0)));
    const dimOpacity=S.timerRunning?'1':'0.6';

    examBanner.style.cssText='background:#1B5EA3;color:#fff;padding:8px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;border-radius:var(--border-radius-md)';

    a.appendChild(examBanner);
  }

  // Top-level parent tabs: Questions, Flash Cards, and Settings (always visible, outside both groups)
  const QUESTION_MODES=['mcq','stats','review','simresults','simreview'];
  const FLASHCARD_MODES=['vocab','vocabstats','vocabwrong'];
  const parentOf=(m)=>QUESTION_MODES.includes(m)?'questions':(FLASHCARD_MODES.includes(m)?'flashcards':'settings');
  const currentParent=parentOf(S.mode);

  const ptop=document.createElement('div');ptop.className='topbar';ptop.style.marginBottom='6px';
  ptop.innerHTML=`<button class="mtab ${currentParent==='questions'?'on':''}" onclick="setParent('questions')">Questions</button>
    <button class="mtab ${currentParent==='flashcards'?'on':''}" onclick="setParent('flashcards')">Flash Cards</button>
    <button class="mtab ${currentParent==='settings'?'on':''}" onclick="setMode('settings')" style="margin-left:auto">Settings</button>`;
  ptop.style.display='flex';
  a.appendChild(ptop);

  const top=document.createElement('div');top.className='topbar';
  if(currentParent==='questions'){
    top.innerHTML=`<button class="mtab ${S.mode==='mcq'?'on':''}" onclick="setMode('mcq')">Practice</button>
      <button class="mtab ${S.mode==='stats'?'on':''}" onclick="setMode('stats')">Stats</button>
      <button class="mtab ${S.mode==='review'?'on':''}" onclick="setMode('review')">Review${(S.simExamActive&&S.examFeedbackMode==='none')?'':`<span style="background:#FAEEDA;color:#633806;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px">${(S.wrongIds.length||0)+(S.flaggedIds&&S.flaggedIds.length?S.flaggedIds.filter(id=>!S.wrongIds.includes(id)).length:0)}</span>`}</button>`;
    a.appendChild(top);
  } else if(currentParent==='flashcards'){
    top.innerHTML=`<button class="mtab ${S.mode==='vocab'?'on':''}" onclick="setMode('vocab')">Flip Cards</button>
      <button class="mtab ${S.mode==='vocabstats'?'on':''}" onclick="setMode('vocabstats')">Stats</button>
      <button class="mtab ${S.mode==='vocabwrong'?'on':''}" onclick="setMode('vocabwrong')">Review<span style="background:#FAEEDA;color:#633806;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px">${(S.vocabStruggling||[]).length}</span></button>`;
    a.appendChild(top);
  }

  // Escape bug fix: must run BEFORE the stats row renders, so session values are correct.
  // Only triggers when preExamOrd is populated - meaning we actually came from an exam.
  // A partial mcqOrd without preExamOrd is a legitimate domain run - leave it alone.
  if(S.mode==='mcq'&&!S.simExamActive&&S.mcqOrd.length<M.length&&S.preExamOrd&&S.preExamOrd.length>0){
    if(S.preExamOrd.length===M.length){
      S.mcqOrd=S.preExamOrd;
      S.mIdx=Math.min(S.preExamIdx||0,S.mcqOrd.length-1);
      S.simC=S.preExamSimC||0;
      S.simT=S.preExamSimT||0;
      S.simCountedIds=S.preExamSimCountedIds||[];
      S.simDomStats=S.preExamSimDomStats||{'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
    } else {
      S.mcqOrd=sh([...Array(M.length).keys()]);
      S.mIdx=0;
      S.simC=0;S.simT=0;S.simCountedIds=[];
      S.simDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
    }
    S.preExamOrd=[];S.preExamIdx=0;
    S.preExamSimC=0;S.preExamSimT=0;S.preExamSimCountedIds=[];S.preExamSimDomStats=null;
    S.postExamSessionRestored=true;
    sS(PK,S);
  }
  // Catch the case where we arrive at mcq with full deck but exam session stats haven't
  // been restored yet (preExamOrd was already cleared but simC/simT still show exam values).
  if(S.mode==='mcq'&&!S.simExamActive&&S.mcqOrd.length===M.length&&S.simExamResults&&!S.postExamSessionRestored){
    S.simC=S.preExamSimC||0;
    S.simT=S.preExamSimT||0;
    S.simCountedIds=S.preExamSimCountedIds||[];
    S.simDomStats=S.preExamSimDomStats||S.simDomStats||{'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
    S.preExamSimC=0;S.preExamSimT=0;S.preExamSimCountedIds=[];S.preExamSimDomStats=null;
    S.postExamSessionRestored=true;
    sS(PK,S);
  }

  if(currentParent==='questions'&&!(S.mode==='review'&&S.wrongPracticeActive)){
    // On the Stats page, the top row reflects whichever sub-tab (Global vs This run)
    // is selected. Everywhere else, it always shows session numbers.
    const showGlobal=(S.mode==='stats'&&S.statsTab==='global');
    const seenVal=showGlobal?S.tS:S.simT;
    const correctVal=showGlobal?S.tC:S.simC;
    const pct=seenVal>0?Math.round(correctVal/seenVal*100):0;
    const missedVal=showGlobal?(S.tS-S.tC):(S.simT-S.simC);
    const seenLabel=showGlobal?'Seen (all-time)':'Seen (session)';
    const accLabel=showGlobal?'Accuracy (all-time)':'Accuracy (session)';
    const missedLabel=showGlobal?'Missed (all-time)':'Missed (session)';
    const correctLabel=showGlobal?'Correct (all-time)':'Correct (session)';
    const noFeedbackMask=S.simExamActive&&S.examFeedbackMode==='none';
    const masked=`<span style="font-size:13px">🔒</span> Hidden`;
    const sr=document.createElement('div');sr.className='stats-row';
    sr.innerHTML=`<div class="stat"><div class="sl">${seenLabel}</div><div class="sv">${seenVal}</div></div>
      <div class="stat"><div class="sl">${accLabel}</div><div class="sv">${noFeedbackMask?masked:pct+'%'}</div></div>
      <div class="stat"><div class="sl">${missedLabel}</div><div class="sv">${noFeedbackMask?masked:missedVal}</div></div>
      <div class="stat"><div class="sl">${correctLabel}</div><div class="sv">${noFeedbackMask?masked:correctVal+'/'+seenVal}</div></div>`;
    a.appendChild(sr);
  }
  if(currentParent==='flashcards'){
    const vIsGlobal=(S.mode==='vocabstats'&&S.vocStatsTab==='global');
    const vSeen=vIsGlobal?(S.vocTotalSeen||0):(S.vocSimCountedIds||[]).length;
    const vGot=vIsGlobal?(S.vocTotalGot||0):(S.vocGot||0);
    const vSeenLabel=vIsGlobal?'Cards seen (all-time)':'Cards seen (session)';
    const vGotLabel=vIsGlobal?'Got it (all-time)':'Got it (session)';
    const vsr=document.createElement('div');vsr.className='stats-row';
    vsr.innerHTML=`<div class="stat"><div class="sl">${vSeenLabel}</div><div class="sv">${vSeen}</div></div>
      <div class="stat"><div class="sl">${vGotLabel}</div><div class="sv">${vGot}</div></div>
      <div class="stat"><div class="sl">Review</div><div class="sv">${(S.vocabStruggling||[]).length}</div></div>
      <div class="stat"><div class="sl">Total cards</div><div class="sv">${V.length}</div></div>`;
    a.appendChild(vsr);
  }

  if(S.mode==='mcq')rMCQ(a);
  else if(S.mode==='vocab')rVocab(a);
  else if(S.mode==='stats')rStats(a);
  else if(S.mode==='review')rReview(a);
  else if(S.mode==='vocabstats')rVocabStats(a);
  else if(S.mode==='vocabwrong')rVocabWrong(a);
  else if(S.mode==='simresults')rSimResults(a);
  else if(S.mode==='simreview')rSimReview(a);
  else rSettings(a);

}

function rMCQ(a){
  // Viewing a past answered card from history
  const viewing=isViewing();
  let ci,chosenAnswer,isRev=false;

  if(viewing){
    const h=S.hist[S.viewIdx];
    ci=h.ci;chosenAnswer=h.choice;isRev=h.rev||false;
  } else {
    // Live question - either a review card or next in shuffle
    if(S.revMode&&S.revQ.length>0){
      ci=S.revQ[0];isRev=true;chosenAnswer=S.ans?S.lastC:-1;
    } else {
      if(S.mIdx>=S.mcqOrd.length){S.mcqOrd=sh(S.mcqOrd.length<M.length?[...S.mcqOrd]:([...Array(M.length).keys()]));S.mIdx=0;}
      ci=S.mcqOrd[S.mIdx];chosenAnswer=S.ans?S.lastC:-1;
    }
  }

  const card=M[ci];
  const answered=viewing||(S.ans&&!isViewing());

  // Determine feedback mode for this render
  // Only applies during active exam (or viewing history from an exam)
  const fbMode=(S.simExamActive||viewing)?S.examFeedbackMode:'full';
  // In correct/incorrect-only mode: show selected option colored but no explanation
  // In no-feedback mode: auto-advance happened already; if we're rendering (e.g. viewing history) show full
  const showExpl=answered&&(fbMode==='full'||viewing);
  const showFullHighlight=answered&&(fbMode==='full'||viewing);
  const showChoiceOnly=answered&&fbMode==='partial'&&!viewing;

  const pb=document.createElement('div');
  pb.innerHTML=`<div class="pb-bg"><div class="pb-fill" style="width:${Math.round(S.mIdx/S.mcqOrd.length*100)}%"></div></div>
    <div class="pb-lbl">${viewing?`Reviewing past answer (${S.viewIdx+1} of ${S.hist.length})`:`${S.mIdx} of ${S.mcqOrd.length} questions this cycle`}</div>`;
  a.appendChild(pb);

  if(viewing){
    const vb=document.createElement('div');
    vb.style.cssText='background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:7px 10px;font-size:13px;color:var(--color-text-secondary);margin-bottom:8px';
    vb.textContent='Viewing past answer - read only';
    a.appendChild(vb);
  } else if(isRev){
    const rb=document.createElement('div');rb.className='rb';rb.textContent='Reviewing a question you got wrong - try again';a.appendChild(rb);
  } else if(S.simExamActive){
    const eb=document.createElement('div');
    eb.style.cssText='background:#E6F1FB;border-radius:var(--border-radius-md);padding:8px 12px;font-size:13px;color:#0C447C;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between';
    const answered=S.simCountedIds?S.simCountedIds.length:0;
    const remaining=S.mcqOrd.length-answered;
    eb.innerHTML=`<span><strong>Practice Exam</strong> \u00b7 ${answered} answered \u00b7 ${remaining} remaining</span>
      <button onclick="endSimExam(false)" style="border:none;background:rgba(12,68,124,0.12);border-radius:var(--border-radius-md);padding:3px 10px;font-size:12px;cursor:pointer;color:#0C447C;font-weight:500">End exam</button>`;
    a.appendChild(eb);
  }

  const isFlagged=S.flaggedIds&&S.flaggedIds.includes(ci);
  const isInWrong=S.wrongIds&&S.wrongIds.includes(ci);
  const domLabel=card.d&&DOMS[card.d]?`<span style="font-size:11px;color:var(--color-text-tertiary);margin-left:8px">Domain ${card.d}</span>`:'';
  const isAnyFlagged=(isInWrong||(S.flaggedIds&&S.flaggedIds.includes(ci)))&&!isRev;
  const wrongBadge=isAnyFlagged?`<span style="font-size:11px;color:#633806;background:#FAEEDA;border-radius:99px;padding:2px 8px;margin-left:8px">Flagged for review</span>`:'';
  const flagBtn=`<button onclick="toggleFlag(${ci})" style="margin-left:auto;border:none;background:none;cursor:pointer;font-size:16px;padding:2px 4px;color:${isFlagged?'#BA7517':'var(--color-text-tertiary)'}" title="${isFlagged?'Unflag question':'Flag for review'}">${isFlagged?'&#9873;':'&#9872;'}</button>`;
  const cd=document.createElement('div');cd.className='card';
  cd.innerHTML=`<div style="display:flex;align-items:center;margin-bottom:9px">
    <div class="badge ${isRev?'br':'bm'}" style="margin-bottom:0">${isRev?'Review':'Practice question'}</div>${domLabel}${wrongBadge}${flagBtn}</div>
    <div class="qt">${esc(card.q).replace(/\n/g,'<br>')}</div>
    <div class="opts" id="opts"></div>
    <div class="expl ${showExpl?'on':''}">${esc(card.e||'')}</div>`;
  a.appendChild(cd);

  const opts=cd.querySelector('#opts');
  card.o.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="ok">${['A','B','C','D'][i]}</span><span>${esc(o)}</span>`;
    if(answered){
      b.disabled=true;
      if(showFullHighlight){
        // Full mode: correct=green, chosen wrong=red
        if(i===card.a)b.classList.add('correct');
        if(i===chosenAnswer&&chosenAnswer!==card.a)b.classList.add('wrong');
      } else if(showChoiceOnly){
        // Partial mode: only the chosen answer gets green or red, nothing else
        if(i===chosenAnswer){
          b.classList.add(chosenAnswer===card.a?'correct':'wrong');
        }
      }
      // No-feedback mode during exam: no highlighting (but no-feedback auto-advances anyway)
    } else {
      b.onclick=()=>pickMCQ(i,ci,isRev);
    }
    opts.appendChild(b);
  });

  // Bottom nav: Prev (if history exists) + Next (if answered or viewing)
  const bot=document.createElement('div');bot.className='bottom';
  const hasPrev=viewing?S.viewIdx>0:S.hist.length>0;
  const prevBtn=hasPrev?`<button class="navbtn" onclick="prevQ()">\u2190 Prev</button>`:`<div></div>`;

  if(viewing){
    // In history: always show Next (leads to next history item or back to live question)
    bot.innerHTML=`${prevBtn}<div class="sc">This run: <span>${S.simC}</span>/${S.simT}</div>
      <button class="navbtn" onclick="nextQ()"> Next →</button>`;
  } else {
    // Live: show Prev + Next (Next only rendered after answering)
    const nextBtn=S.ans?`<button class="nxt on" onclick="nxt()">Next \u2192</button>`:`<div></div>`;
    bot.innerHTML=`${prevBtn}<div class="sc">This run: <span>${S.simC}</span>/${S.simT}</div>${nextBtn}`;
  }
  a.appendChild(bot);
}

async function pickMCQ(choice,ci,isRev){
  const card=M[ci];S.ans=true;S.lastC=choice;
  const correct=choice===card.a;

  if(!S.countedIds)S.countedIds=[];
  if(!S.simCountedIds)S.simCountedIds=[];

  // Global (all-time) stats: count the first time EVER a question is scored.
  if(!S.countedIds.includes(ci)){
    S.countedIds.push(ci);
    S.tS++;
    if(correct)S.tC++;
    if(card.d&&S.domStats[card.d]){S.domStats[card.d].t++;if(correct)S.domStats[card.d].c++;}
  }

  // Test-simulation stats: count the first time SINCE THE LAST SIMULATION RESET.
  if(!S.simCountedIds.includes(ci)){
    S.simCountedIds.push(ci);
    S.simT++;
    if(correct)S.simC++;
    if(!S.simDomStats)S.simDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
    if(card.d&&S.simDomStats[card.d]){S.simDomStats[card.d].t++;if(correct)S.simDomStats[card.d].c++;}
  }

  // Record answer for post-exam review
  if(S.simExamActive){
    if(!S.simExamAnswers)S.simExamAnswers={};
    S.simExamAnswers[ci]=choice;
  }

  if(correct){
    // Getting it right doesn't remove from Review - that requires manual dismissal.
    // We do mark it resolved so the badge reflects "got it right" and it won't
    // re-inject as a review question, but the entry stays in the Review tab.
    if(S.wrongIds.includes(ci)){
      if(!S.resolved)S.resolved={};
      S.resolved[ci]=true;
    }
    // Also track session-only "got it right this session" for the score display
    // but do NOT clear wrongLastChoice or wrongFailCount - history matters for Review
  } else {
    if(!S.wrongIds.includes(ci))S.wrongIds.push(ci);
    if(!S.resolved)S.resolved={};
    if(!S.wrongLastChoice)S.wrongLastChoice={};
    if(!S.wrongFailCount)S.wrongFailCount={};
    S.resolved[ci]=false;
    S.wrongLastChoice[ci]=choice;
    S.wrongFailCount[ci]=(S.wrongFailCount[ci]||0)+1;
  }
  S.hist.push({ci,choice,rev:isRev});
  if(S.hist.length>50)S.hist.shift();
  S.viewIdx=-1;

  // No-feedback exam mode: auto-advance immediately
  if(S.simExamActive&&S.examFeedbackMode==='none'){
    await sS(PK,S);
    nxt();
    return;
  }

  await sS(PK,S);render();
}

async function nxt(){
  if(isViewing()){
    // Should not be called while viewing, but handle gracefully
    S.viewIdx=-1;await sS(PK,S);render();return;
  }
  S.ans=false;S.lastC=-1;S.viewIdx=-1;
  // Always increment mIdx when moving forward
  S.mIdx++;
  if(S.mIdx>=S.mcqOrd.length){
    if(S.simExamActive){
      // Exam complete - end it
      endSimExam(false);
      return;
    }
    S.mcqOrd=sh(S.mcqOrd.length<M.length?[...S.mcqOrd]:([...Array(M.length).keys()]));S.mIdx=0;
  }
  // Clear review state
  S.revQ=[];S.revMode=false;
  // Inject a review card every 7 questions if wrong list is non-empty,
  // but only once at least 7 have been answered this run (prevents
  // immediate injection right after a score reset when mIdx happens
  // to already sit on a multiple of 7). Skip injection during sim exam.
  if(S.reviewInjectEnabled!==false&&!S.simExamActive&&S.wrongIds.length>0&&S.mIdx%7===0&&(S.simCountedIds||[]).length>=7){
    const pool=S.wrongIds.slice();
    if(pool.length>0){
      S.revQ=[pool[Math.floor(Math.random()*pool.length)]];
      S.revMode=true;
    }
  }
  await sS(PK,S);render();
}

async function prevQ(){
  if(isViewing()&&S.viewIdx>0){
    S.viewIdx--;await sS(PK,S);render();
  } else if(!isViewing()&&S.hist.length>0){
    S.viewIdx=S.hist.length-1;
    await sS(PK,S);render();
  }
}

async function nextQ(){
  if(!isViewing())return;
  if(S.viewIdx<S.hist.length-1){
    S.viewIdx++;await sS(PK,S);render();
  } else {
    S.viewIdx=-1;await sS(PK,S);render();
  }
}

async function vRes(k,cardId){
  S.vocSeen=(S.vocSeen||0)+1;
  if(!S.vocabStruggling)S.vocabStruggling=[];
  if(!S.vocResolved)S.vocResolved={};
  if(!S.vocFailCount)S.vocFailCount={};
  if(!S.vocHist)S.vocHist=[];
  if(!S.vocSimCountedIds)S.vocSimCountedIds=[];
  if(!S.vocDomStats)S.vocDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0},'G':{c:0,t:0}};
  if(!S.vocSimDomStats)S.vocSimDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0},'G':{c:0,t:0}};

  const card=V[cardId];
  const dom=card&&card.d?card.d:'G';

  // Global (all-time): first time this card is EVER answered
  if(!S.vocTotalCounted)S.vocTotalCounted=[];
  if(!S.vocTotalCounted.includes(cardId)){
    S.vocTotalCounted.push(cardId);
    S.vocTotalSeen=(S.vocTotalSeen||0)+1;
    if(k)S.vocTotalGot=(S.vocTotalGot||0)+1;
    if(S.vocDomStats[dom]){S.vocDomStats[dom].t++;if(k)S.vocDomStats[dom].c++;}
  }
  // Session: first time since last vocab session reset
  if(!S.vocSimCountedIds.includes(cardId)){
    S.vocSimCountedIds.push(cardId);
    S.vocGot=k?(S.vocGot||0)+1:(S.vocGot||0);
    if(S.vocSimDomStats[dom]){S.vocSimDomStats[dom].t++;if(k)S.vocSimDomStats[dom].c++;}
  }

  if(k){
    if(S.vocabStruggling.includes(cardId)){
      S.vocResolved[cardId]=true;
    }
  } else {
    if(!S.vocabStruggling.includes(cardId))S.vocabStruggling.push(cardId);
    S.vocResolved[cardId]=false;
    S.vocFailCount[cardId]=(S.vocFailCount[cardId]||0)+1;
  }
  S.vocHist.push({cardId,gotIt:k});
  if(S.vocHist.length>50)S.vocHist.shift();
  S.vocViewIdx=-1;
  S.vIdx++;S.vFlip=false;await sS(PK,S);render();
}

function startVocabPractice(unresolvedOnly){
  let pool=S.vocabStruggling.slice();
  if(unresolvedOnly)pool=pool.filter(id=>!(S.vocResolved&&S.vocResolved[id]));
  if(pool.length===0){alert('No cards to practice in this set.');return;}
  pool=sh(pool);
  S.vocPracticeActive=true;
  S.vpQueue=pool;
  S.vpIdx=0;
  S.vpHist=[];
  S.vpViewIdx=-1;
  S.vpFlip=false;
  sS(PK,S);render();
}

function vpIsViewing(){return S.vpViewIdx>=0&&S.vpViewIdx<S.vpHist.length;}

function rVocabPractice(a){
  const viewing=vpIsViewing();
  let cardId;

  if(viewing){
    cardId=S.vpHist[S.vpViewIdx];
  } else {
    if(S.vpIdx>=S.vpQueue.length){
      S.vocPracticeActive=false;
      sS(PK,S);
      setTimeout(()=>render(),0);
      return;
    }
    cardId=S.vpQueue[S.vpIdx];
  }

  const card=V[cardId];
  const flipped=viewing||S.vpFlip;

  const hdr=document.createElement('div');
  hdr.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
  hdr.innerHTML=`<span style="font-size:12px;color:var(--color-text-tertiary)">${viewing?`Viewing ${S.vpViewIdx+1} of ${S.vpHist.length}`:`Practicing Review cards: ${S.vpIdx+1} of ${S.vpQueue.length}`}</span>
    <span style="font-size:11px;color:var(--color-text-tertiary);background:var(--color-background-secondary);border-radius:99px;padding:2px 9px">Not counted toward cycle progress</span>`;
  a.appendChild(hdr);

  const cd=document.createElement('div');cd.className='card';cd.style.textAlign='center';
  if(!flipped&&!viewing)cd.style.cursor='pointer';
  cd.innerHTML=`<div class="badge br" style="margin-bottom:0">Flashcard Review practice</div>
    <div class="vf">${esc(card.term)}</div>
    <div class="vh">${flipped?'':'Tap to reveal definition'}</div>
    <div class="vb ${flipped?'on':''}">${esc(card.def)}</div>`;
  if(!flipped&&!viewing)cd.onclick=()=>flipVP();
  a.appendChild(cd);

  if(flipped&&!viewing){
    const btns=document.createElement('div');btns.className='vbtns on';
    btns.innerHTML=`<button class="vbtn r" onclick="pickVP(false,${cardId})">Still need practice</button>
      <button class="vbtn g" onclick="pickVP(true,${cardId})">Got it</button>`;
    a.appendChild(btns);
  }

  const bot=document.createElement('div');bot.className='bottom';
  const hasPrev=viewing?S.vpViewIdx>0:S.vpHist.length>0;
  const prevBtn=hasPrev?`<button class="navbtn" onclick="prevVP()">\u2190 Prev</button>`:`<div></div>`;
  const backBtn=`<button class="navbtn" onclick="exitVocabPractice()">Return to list</button>`;
  bot.innerHTML=viewing
    ? `${prevBtn}${backBtn}<button class="navbtn" onclick="nextVP()">\u202fNext \u2192</button>`
    : `${prevBtn}${backBtn}<div></div>`;
  bot.style.flexWrap='wrap';
  bot.style.gap='8px';
  a.appendChild(bot);
}

async function flipVP(){S.vpFlip=true;await sS(PK,S);render();}

async function pickVP(k,cardId){
  if(!S.vocResolved)S.vocResolved={};
  if(!S.vocFailCount)S.vocFailCount={};
  if(k){
    S.vocResolved[cardId]=true;
  } else {
    S.vocResolved[cardId]=false;
    S.vocFailCount[cardId]=(S.vocFailCount[cardId]||0)+1;
  }
  S.vpHist.push(cardId);
  if(S.vpHist.length>50)S.vpHist.shift();
  S.vpViewIdx=-1;S.vpFlip=false;
  S.vpIdx++;
  await sS(PK,S);render();
}

async function prevVP(){
  if(vpIsViewing()&&S.vpViewIdx>0){
    S.vpViewIdx--;await sS(PK,S);render();
  } else if(!vpIsViewing()&&S.vpHist.length>0){
    S.vpViewIdx=S.vpHist.length-1;
    await sS(PK,S);render();
  }
}

async function nextVP(){
  if(!vpIsViewing())return;
  if(S.vpViewIdx<S.vpHist.length-1){
    S.vpViewIdx++;await sS(PK,S);render();
  } else {
    S.vpViewIdx=-1;await sS(PK,S);render();
  }
}

async function exitVocabPractice(){
  S.vocPracticeActive=false;
  await sS(PK,S);render();
}

async function resetAll(){
  if(!confirm('Reset all progress?\n\nThis will clear your Security+ deck stats, wrong answers, history, and shuffle order. No other browser data will be affected. This cannot be undone.'))return;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  try{localStorage.removeItem(PK);}catch(e){}
  S=DS();
  S.mcqOrd=sh([...Array(M.length).keys()]);
  S.vocOrd=sh([...Array(V.length).keys()]);
  await sS(PK,S);
  renderTimer();render();
}

    const r=S.wpSessionResults;

          <div class="badge ${badgeClass}" style="margin-bottom:0">${badgeText}</div>${domTag}${isManuallFlagged&&wasActuallyMissed?flagTag:''}

  S.wpHist=[];
  S.wpViewIdx=-1;
  S.wpAns=false;
  S.wpLastC=-1;
  S.wpSessionCorrect=0;
  S.wpSessionResults=null;
  sS(PK,S);render();
}

function wpIsViewing(){return S.wpViewIdx>=0&&S.wpViewIdx<S.wpHist.length;}

function rWrongPractice(a){
  const viewing=wpIsViewing();
  let ci,chosenAnswer;

  if(viewing){
    const h=S.wpHist[S.wpViewIdx];
    ci=h.ci;chosenAnswer=h.choice;
  } else {
    if(S.wpIdx>=S.wpQueue.length){
      // Finished the cycle - store results and return to list
      // Use setTimeout to break out of the current render cycle (render lock is held)
      S.wpSessionResults={correct:S.wpSessionCorrect||0,total:S.wpQueue.length};
      S.wrongPracticeActive=false;
      sS(PK,S);
      setTimeout(()=>render(),0);
      return;
    }
    ci=S.wpQueue[S.wpIdx];
    chosenAnswer=S.wpAns?S.wpLastC:-1;
  }

  const card=M[ci];
  const answered=viewing||S.wpAns;

  const hdr=document.createElement('div');
  hdr.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
  hdr.innerHTML=`<span style="font-size:12px;color:var(--color-text-tertiary)">${viewing?`Viewing ${S.wpViewIdx+1} of ${S.wpHist.length}`:`Practicing wrong answers: ${S.wpIdx+1} of ${S.wpQueue.length}`}</span>
    <span style="font-size:11px;color:var(--color-text-tertiary);background:var(--color-background-secondary);border-radius:99px;padding:2px 9px">Not counted toward score</span>`;
  a.appendChild(hdr);

  const domLabel=card.d&&DOMS[card.d]?`<span style="font-size:11px;color:var(--color-text-tertiary);margin-left:8px">Domain ${card.d}</span>`:'';
  const cd=document.createElement('div');cd.className='card';
  cd.innerHTML=`<div style="display:flex;align-items:center;margin-bottom:9px">
    <div class="badge br" style="margin-bottom:0">Wrong-answer practice</div>${domLabel}</div>
    <div class="qt">${esc(card.q).replace(/\n/g,'<br>')}</div>
    <div class="opts" id="wpopts"></div>
    <div class="expl ${answered?'on':''}">${esc(card.e||'')}</div>`;
  a.appendChild(cd);

  const opts=cd.querySelector('#wpopts');
  card.o.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="ok">${['A','B','C','D'][i]}</span><span>${esc(o)}</span>`;
    if(answered){
      b.disabled=true;
      if(i===card.a)b.classList.add('correct');
      if(i===chosenAnswer&&chosenAnswer!==card.a)b.classList.add('wrong');
    } else {
      b.onclick=()=>pickWP(i,ci);
    }
    opts.appendChild(b);
  });

  const bot=document.createElement('div');bot.className='bottom';
  const hasPrev=viewing?S.wpViewIdx>0:S.wpHist.length>0;
  const prevBtn=hasPrev?`<button class="navbtn" onclick="prevWP()">\u2190 Prev</button>`:`<div></div>`;
  const backBtn=`<button class="navbtn" onclick="exitWrongPractice()">Return to list</button>`;

  if(viewing){
    bot.innerHTML=`${prevBtn}${backBtn}<button class="navbtn" onclick="nextWP()">\u202fNext \u2192</button>`;
  } else {
    const nextBtn=S.wpAns?`<button class="nxt on" onclick="nxtWP()">Next \u2192</button>`:`<div></div>`;
    bot.innerHTML=`${prevBtn}${backBtn}${nextBtn}`;
  }
  bot.style.flexWrap='wrap';
  bot.style.gap='8px';
  a.appendChild(bot);
}

async function pickWP(choice,ci){
  const card=M[ci];
  S.wpAns=true;S.wpLastC=choice;
  const correct=choice===card.a;

  if(!S.wrongFailCount)S.wrongFailCount={};
  if(!S.resolved)S.resolved={};
  if(!S.wrongLastChoice)S.wrongLastChoice={};

  S.wrongLastChoice[ci]=choice;
  if(correct){
    S.resolved[ci]=true;
    S.wpSessionCorrect=(S.wpSessionCorrect||0)+1;
  } else {
    S.resolved[ci]=false;
    S.wrongFailCount[ci]=(S.wrongFailCount[ci]||1)+1;
  }

  S.wpHist.push({ci,choice});
  if(S.wpHist.length>50)S.wpHist.shift();
  S.wpViewIdx=-1;
  await sS(PK,S);render();
}

async function nxtWP(){
  S.wpAns=false;S.wpLastC=-1;S.wpViewIdx=-1;
  S.wpIdx++;
  await sS(PK,S);render();
}

async function prevWP(){

    S.wpViewIdx=S.wpHist.length-1;

async function nextWP(){

// Resets ONLY the session/run counters (simC/simT/simDomStats) and optionally
// repositions the deck. Wrong-tab data and global all-time stats (tS/tC/domStats/countedIds)
// are deliberately left untouched here.
async function startNewRun(deckOption){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  S.timerRunning=false;S.timerElapsed=0;
  S.simC=0;S.simT=0;S.simCountedIds=[];
  S.simDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};

  if(deckOption==='unseen'){
    // Keep current shuffle, just jump to wherever unseen questions remain.
    // If we've reached the end, reshuffle (nothing left to skip to).
    if(S.mIdx>=M.length){
      S.mcqOrd=sh([...Array(M.length).keys()]);
      S.mIdx=0;
    }
    // else: leave mIdx where it is, continuing forward into not-yet-seen questions
  } else if(deckOption==='all'){
    S.mcqOrd=sh([...Array(M.length).keys()]);
    S.mIdx=0;
  }

  S.ans=false;S.lastC=-1;S.viewIdx=-1;S.hist=[];
  S.mode='mcq';
  await sS(PK,S);renderTimer();render();
}

function endSimExam(timedOut){
  timerPause();
  const unanswered=S.mcqOrd.length-S.simCountedIds.length;
  S.simExamActive=false;
  S.simExamResults={
    simC:S.simC,simT:S.simT,
    unanswered:unanswered,
    timedOut:timedOut||false,
    timeElapsed:S.timerElapsed,timeTarget:S.timerTarget,
    simDomStats:JSON.parse(JSON.stringify(S.simDomStats)),
    examQids:S.mcqOrd.slice(),
    examAnswers:JSON.parse(JSON.stringify(S.simExamAnswers||{}))
  };
  S.mode='simresults';
  sS(PK,S);renderTimer();
  setTimeout(()=>render(),0);
}

async function startSimTest(){
  // Official SY0-701 domain distribution: D1=12%, D2=22%, D3=18%, D4=28%, D5=20%
  // Applied to 90 questions: 11, 20, 16, 25, 18
  const domCounts={'1':11,'2':20,'3':16,'4':25,'5':18};
  const pool=[];
  ['1','2','3','4','5'].forEach(d=>{
    const domQs=M.reduce((acc,c,i)=>{if(c.d===d)acc.push(i);return acc;},[]);
    const shuffled=sh(domQs.slice());
    pool.push(...shuffled.slice(0,domCounts[d]));
  });
  if(pool.length<90){
    alert(`Not enough questions to build a full 90-question test (found ${pool.length}). Check domain coverage.`);return;
  }
  // Save pre-exam state so Back to Practice can restore it exactly -
  // both deck position AND session score/stats, not just position.
  S.preExamOrd=S.mcqOrd.slice();
  S.preExamIdx=S.mIdx;
  S.preExamSimC=S.simC;
  S.preExamSimT=S.simT;
  S.preExamSimCountedIds=(S.simCountedIds||[]).slice();
  S.preExamSimDomStats=JSON.parse(JSON.stringify(S.simDomStats||{'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}}));
  S.mcqOrd=sh(pool);
  S.mIdx=0;
  S.simC=0;S.simT=0;S.simCountedIds=[];
  S.simDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
  S.simExamAnswers={};  // track {qIdx: chosenAnswerIdx} for post-exam review
  S.ans=false;S.lastC=-1;S.viewIdx=-1;S.hist=[];
  S.revQ=[];S.revMode=false;
  S.simExamActive=true;
  S.simExamResults=null;
  S.postExamSessionRestored=false;
  // Start the 90-minute countdown timer automatically
  S.timerMode='countdown';S.timerTarget=5400;S.timerElapsed=0;S.timerRunning=true;
  S.mode='mcq';
  await sS(PK,S);
  // Start the timer interval
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(timerTick,1000);
  renderTimer();render();
}

async function startDomainRun(domain){
  // Collect all question indices for this domain, shuffle them
  const pool=M.reduce((acc,c,i)=>{if(c.d===domain)acc.push(i);return acc;},[]);
  if(!pool.length){alert(`No questions found for Domain ${domain}.`);return;}
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  S.timerRunning=false;S.timerElapsed=0;
  // Shuffle the pool and use it as the new deck order
  S.mcqOrd=sh(pool);
  S.mIdx=0;
  // Reset session score for a clean run
  S.simC=0;S.simT=0;S.simCountedIds=[];
  S.simDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
  S.ans=false;S.lastC=-1;S.viewIdx=-1;S.hist=[];
  S.mode='mcq';
  await sS(PK,S);renderTimer();render();
}

  ['1','2','3','4','5'].forEach(d=>{
    const st=r.simDomStats[d]||{c:0,t:0};
    const dpct=st.t>0?Math.round(st.c/st.t*100):0;
    const dc=dpct>=83?'#1D9E75':dpct>=70?'#BA7517':'#A32D2D';
    const row=document.createElement('div');row.style.cssText='margin-bottom:10px';
    row.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:12px;color:var(--color-text-primary)">D${d}: ${DNAMES[d]}</span>
        <span style="font-size:12px;font-weight:500;color:${dc}">${st.t>0?dpct+'%':'-'} (${st.c}/${st.t||domCounts[d]})</span>
      </div>
      <div style="background:var(--color-background-secondary);border-radius:99px;height:5px;overflow:hidden">
        <div style="height:100%;border-radius:99px;background:${dc};width:${dpct}%;transition:width .4s"></div>
      </div>`;
    a.appendChild(row);
  });

  const btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:16px';

  const copyBtn=document.createElement('button');
  copyBtn.style.cssText='border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 16px;font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary)';
  copyBtn.textContent='Copy results';
  copyBtn.onclick=()=>{
    const lines=[
      'CompTIA Security+ SY0-701 Practice Exam',
      `Result: ${likelyPass?'LIKELY PASS':'NEEDS WORK'} - ${pctOf90}% (${r.simC}/${total})`,
      r.timedOut?'Exam ended: time expired':`Time remaining: ${fmtTime(timeLeft)}`,
      unanswered>0?`Unanswered: ${unanswered}`:'',
      '',
      'Domain breakdown:',
      ...['1','2','3','4','5'].map(d=>{
        const st=r.simDomStats[d]||{c:0,t:0};
        const dp=st.t>0?Math.round(st.c/st.t*100):0;
        return `  D${d} ${DNAMES[d]}: ${dp}% (${st.c}/${st.t||domCounts[d]})`;
      })
    ].filter(Boolean);
    navigator.clipboard.writeText(lines.join('\n')).then(()=>{
      copyBtn.textContent='Copied!';
      setTimeout(()=>copyBtn.textContent='Copy results',2000);
    });
  };

  // Primary action row
  const primaryRow=document.createElement('div');primaryRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:16px';

  const practiceBtn=document.createElement('button');
  practiceBtn.style.cssText='flex:1;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 16px;font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500';
  practiceBtn.textContent='Back to Practice';
  practiceBtn.onclick=async()=>{
    if(S.preExamOrd&&S.preExamOrd.length===M.length){
      S.mcqOrd=S.preExamOrd;
      S.mIdx=Math.min(S.preExamIdx||0,S.mcqOrd.length-1);
      S.simC=S.preExamSimC||0;
      S.simT=S.preExamSimT||0;
      S.simCountedIds=S.preExamSimCountedIds||[];
      S.simDomStats=S.preExamSimDomStats||{'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
    } else {
      S.mcqOrd=sh([...Array(M.length).keys()]);
      S.mIdx=0;
      S.simC=0;S.simT=0;S.simCountedIds=[];
      S.simDomStats={'1':{c:0,t:0},'2':{c:0,t:0},'3':{c:0,t:0},'4':{c:0,t:0},'5':{c:0,t:0}};
    }
    S.mode='mcq';S.ans=false;
    S.preExamOrd=[];S.preExamIdx=0;
    S.preExamSimC=0;S.preExamSimT=0;S.preExamSimCountedIds=[];S.preExamSimDomStats=null;
    S.postExamSessionRestored=true;
    await sS(PK,S);render();
  };
  primaryRow.appendChild(practiceBtn);

  // Review exam answers button - count wrong answers from this exam
  const wrongInExam=r.examQids?(r.examQids.filter(qi=>{
    const chosen=r.examAnswers&&r.examAnswers[qi];
    return chosen!==undefined&&chosen!==M[qi]?.a;
  }).length):0;

  if(r.examQids&&r.examQids.length>0){
    const reviewBtn=document.createElement('button');
    reviewBtn.style.cssText='flex:1;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 16px;font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500';
    reviewBtn.textContent=`Review exam answers (${wrongInExam} wrong)`;
    reviewBtn.onclick=async()=>{S.simReviewFilter='wrong';S.mode='simreview';await sS(PK,S);render();};
    primaryRow.appendChild(reviewBtn);
  }
  a.appendChild(primaryRow);

  // Secondary row - copy only
  const secRow=document.createElement('div');secRow.style.cssText='display:flex;gap:8px;margin-top:8px';
  btnRow.style.cssText=''; // repurpose btnRow as secondary
  secRow.appendChild(copyBtn);
  a.appendChild(secRow);
}



// ===== POST-EXAM REVIEW =====
function rSimReview(a){
  const r=S.simExamResults;
  if(!r||!r.examQids){setMode('review');return;}

  const filter=S.simReviewFilter||'wrong';
  const showEval=S.simReviewShowEval!==false; // default true

  // Exam stats summary card (toggleable)
  const evalToggleRow=document.createElement('div');evalToggleRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px';
  const evalLabel=document.createElement('span');evalLabel.style.cssText='font-size:14px;font-weight:600;color:var(--color-text-primary)';evalLabel.textContent='Exam answer review';
  const evalToggle=document.createElement('label');evalToggle.style.cssText='display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--color-text-secondary)';
  evalToggle.innerHTML=`<input type="checkbox" ${showEval?'checked':''} style="cursor:pointer"> Show evaluation`;
  evalToggle.querySelector('input').onchange=async(e)=>{S.simReviewShowEval=e.target.checked;await sS(PK,S);render();};
  evalToggleRow.appendChild(evalLabel);evalToggleRow.appendChild(evalToggle);
  a.appendChild(evalToggleRow);

  if(showEval){
    const totalAnswered=Object.keys(r.examAnswers||{}).length;
    const totalCorrect=r.examQids.filter(qi=>{const c=(r.examAnswers||{})[qi];return c!==undefined&&c===M[qi]?.a;}).length;
    const totalWrong=totalAnswered-totalCorrect;
    const pct=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
    const passed=pct>=83;
    const unanswered=r.unanswered||0;

    const evalCard=document.createElement('div');
    evalCard.style.cssText=`border:0.5px solid ${passed?'#3B6D11':'#9B3720'};border-radius:var(--border-radius-md);padding:12px 14px;margin-bottom:12px;background:${passed?'rgba(59,109,17,0.07)':'rgba(155,55,32,0.07)'}`;

    // Pass/fail + score
    const scoreRow=document.createElement('div');scoreRow.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:8px';
    const badge=document.createElement('span');
    badge.style.cssText=`font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;background:${passed?'#3B6D11':'#9B3720'};color:#fff`;
    badge.textContent=passed?'PASS':'FAIL';
    const scoreSpan=document.createElement('span');scoreSpan.style.cssText='font-size:15px;font-weight:600;color:var(--color-text-primary)';
    scoreSpan.textContent=`${totalCorrect} / ${totalAnswered} correct (${pct}%)`;
    scoreRow.appendChild(badge);scoreRow.appendChild(scoreSpan);
    evalCard.appendChild(scoreRow);

    // Stats row
    const statsRow=document.createElement('div');statsRow.style.cssText='display:flex;gap:16px;flex-wrap:wrap';
    [
      ['Correct',totalCorrect,'#3B6D11'],
      ['Wrong',totalWrong,'#9B3720'],
      ...(unanswered>0?[['Unanswered',unanswered,'var(--color-text-tertiary)']]:[[]])
    ].filter(x=>x.length).forEach(([lbl,val,col])=>{
      const s=document.createElement('div');s.style.cssText='font-size:12px;color:var(--color-text-secondary)';
      s.innerHTML=`<span style="font-weight:600;color:${col}">${val}</span> ${lbl}`;
      statsRow.appendChild(s);
    });
    evalCard.appendChild(statsRow);

    // Domain breakdown
    if(r.simDomStats){
      const domRow=document.createElement('div');domRow.style.cssText='margin-top:10px;display:flex;flex-direction:column;gap:3px';
      const domTitle=document.createElement('div');domTitle.style.cssText='font-size:11px;font-weight:600;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px';
      domTitle.textContent='By domain';domRow.appendChild(domTitle);
      Object.entries(r.simDomStats).forEach(([d,st])=>{
        if(!st.t)return;
        const p=Math.round(st.c/st.t*100);
        const dname=DOMS[d]?`D${d}: ${DOMS[d]}`:`Domain ${d}`;
        const dr=document.createElement('div');dr.style.cssText='display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary)';
        dr.innerHTML=`<span style="flex:0 0 160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dname}</span><span style="font-weight:500;color:${p>=83?'#3B6D11':'#9B3720'}">${st.c}/${st.t} (${p}%)</span>`;
        domRow.appendChild(dr);
      });
      evalCard.appendChild(domRow);
    }
    a.appendChild(evalCard);
  }

  const sub=document.createElement('div');sub.style.cssText='font-size:12px;color:var(--color-text-secondary);margin-bottom:12px';
  sub.textContent='Wrong answers are also in your Review tab.';a.appendChild(sub);

  // Filter toggle
  const filterRow=document.createElement('div');filterRow.style.cssText='display:flex;gap:6px;margin-bottom:14px';
  [['wrong','Wrong only'],['correct','Correct only'],['all','All answered']].forEach(([key,label])=>{
    const btn=document.createElement('button');
    btn.style.cssText=`border:0.5px solid var(--color-border-secondary);border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer;background:${filter===key?'var(--color-text-primary)':'var(--color-background-primary)'};color:${filter===key?'var(--color-background-primary)':'var(--color-text-primary)'}`;
    btn.textContent=label;
    btn.onclick=async()=>{S.simReviewFilter=key;await sS(PK,S);render();};
    filterRow.appendChild(btn);
  });
  a.appendChild(filterRow);

  // Build list
  const qids=r.examQids.filter(qi=>{
    const answers=r.examAnswers||{};
    const chosen=answers[qi];
    if(chosen===undefined)return false; // unanswered - never show
    const correct=chosen===M[qi]?.a;
    if(filter==='wrong')return !correct;
    if(filter==='correct')return correct;
    return true; // all
  });

  if(!qids.length){
    const empty=document.createElement('div');empty.style.cssText='font-size:13px;color:var(--color-text-secondary);padding:20px 0';
    empty.textContent=filter==='wrong'?'No wrong answers - great work!':filter==='correct'?'No correct answers recorded.':'No answered questions found.';
    a.appendChild(empty);
  } else {
    const countNote=document.createElement('div');countNote.className='shead';
    countNote.textContent=`${qids.length} question${qids.length===1?'':'s'}`;
    a.appendChild(countNote);

    qids.forEach(qi=>{
      const card=M[qi];if(!card)return;
      const chosen=(r.examAnswers||{})[qi];
      const correct=chosen===card.a;
      const domTag=card.d&&DOMS[card.d]?`<span style="font-size:11px;color:var(--color-text-tertiary);margin-left:8px">Domain ${card.d}</span>`:'';
      const item=document.createElement('div');item.className='card';item.style.marginBottom='10px';
      item.innerHTML=`<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:9px">
          <div class="badge ${correct?'bg':'br'}" style="margin-bottom:0">${correct?'Correct':'Incorrect'}</div>${domTag}
        </div>
        <div class="qt">${esc(card.q).replace(/\n/g,'<br>')}</div>
        <div class="opts" id="sropt-${qi}"></div>
        <div class="expl on">${esc(card.e||'')}</div>`;
      const optsEl=item.querySelector(`#sropt-${qi}`);
      card.o.forEach((o,i)=>{
        const b=document.createElement('div');b.className='opt';b.style.cursor='default';
        b.innerHTML=`<span class="ok">${['A','B','C','D'][i]}</span><span>${esc(o)}</span>`;
        if(i===card.a)b.classList.add('correct');
        if(i===chosen&&chosen!==card.a)b.classList.add('wrong');
        optsEl.appendChild(b);
      });
      a.appendChild(item);
    });
  }

  // Back button
  const backBtn=document.createElement('button');
  backBtn.style.cssText='margin-top:8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 16px;font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary)';
  backBtn.textContent='Back to results';
  backBtn.onclick=async()=>{S.mode='simresults';await sS(PK,S);render();};
  a.appendChild(backBtn);
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(!S)return;
  if(S.keyboardShortcutsEnabled===false)return;

  if(S.mode==='mcq'){
    if(!isViewing()&&!S.ans&&!S.revMode){
      const keyMap={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
      const k=e.key.toLowerCase();
      if(keyMap[k]!==undefined){
        const ci=S.mcqOrd[S.mIdx];
        if(ci!==undefined)pickMCQ(keyMap[k],ci,false);
        return;
      }
    }
    if(!isViewing()&&!S.ans&&S.revMode&&S.revQ.length>0){
      const keyMap={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
      const k=e.key.toLowerCase();
      if(keyMap[k]!==undefined){
        pickMCQ(keyMap[k],S.revQ[0],true);return;
      }
    }
    if(e.key==='ArrowRight'){
      if(isViewing()){nextQ();}
      else if(S.ans){nxt();}
      return;
    }
    if(e.key==='ArrowLeft'){prevQ();return;}
    if((e.key==='f'||e.key==='F')&&!isViewing()){
      const ci=S.revMode&&S.revQ.length?S.revQ[0]:S.mcqOrd[S.mIdx];
      if(ci!==undefined)toggleFlag(ci);
    }
  }
  if(S.mode==='vocab'&&!vocIsViewing()){
    if((e.key===' '||e.key==='Enter')&&!S.vFlip){e.preventDefault();flipV();return;}
    if(S.vFlip){
      const ci=S.vocOrd[S.vIdx];
      if((e.key==='ArrowRight'||e.key==='g'||e.key==='G')&&ci!==undefined){vRes(true,ci);return;}
      if((e.key==='ArrowLeft'||e.key==='b'||e.key==='B')&&ci!==undefined){vRes(false,ci);return;}
    } else {
      if(e.key==='ArrowLeft')prevVoc();
    }
  }
});

// ===== FLAG/BOOKMARK =====
async function toggleFlag(ci){
  if(!S.flaggedIds)S.flaggedIds=[];
  if(!S.wrongIds)S.wrongIds=[];
  if(!S.resolved)S.resolved={};
  if(!S.wrongLastChoice)S.wrongLastChoice={};
  if(!S.wrongFailCount)S.wrongFailCount={};

  if(S.flaggedIds.includes(ci)){
    // Unflagging - remove flag
    S.flaggedIds=S.flaggedIds.filter(id=>id!==ci);
    // Only remove from wrongIds if it was ONLY there because of the flag
    // (i.e. it was never actually answered wrong - failCount was 0 or not set)
    const wasActuallyWrong=(S.wrongFailCount[ci]||0)>0;
    if(!wasActuallyWrong){
      S.wrongIds=S.wrongIds.filter(id=>id!==ci);
      delete S.resolved[ci];
      delete S.wrongLastChoice[ci];
    }
  } else {
    // Flagging - add to flaggedIds
    S.flaggedIds.push(ci);
    // Add to wrongIds so it appears in Review tab
    if(!S.wrongIds.includes(ci)){
      S.wrongIds.push(ci);
      // Check if this question was ever answered correctly (look in history)
      const wasCorrect=S.hist&&S.hist.some(h=>h.ci===ci&&M[ci]&&h.choice===M[ci].a);
      if(wasCorrect){
        // Already answered correctly - show as resolved/green immediately
        S.resolved[ci]=true;
        S.wrongLastChoice[ci]=M[ci].a; // correct choice = green/green display
      } else {
        // Not yet answered or answered wrong - show as unresolved
        // Don't overwrite existing wrongLastChoice if already there
        if(S.wrongLastChoice[ci]===undefined)S.wrongLastChoice[ci]=-1;
        S.resolved[ci]=false;
      }
    }
  }
  await sS(PK,S);render();
}

async function setMode(m){S.viewIdx=-1;S.mode=m;await sS(PK,S);render();}
async function setParent(p){
  if(p==='questions')S.mode='mcq';
  else if(p==='flashcards')S.mode='vocab';
  S.viewIdx=-1;
  await sS(PK,S);render();
}
init();

</script>
